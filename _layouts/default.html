<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #172033;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #3157d5;
      --brand-strong: #2445b8;
      --brand-soft: #eef2ff;
      --shadow: 0 16px 40px rgba(30, 41, 59, 0.07);
      --radius-lg: 22px;
      --radius-md: 14px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(99, 102, 241, 0.08), transparent 28rem),
        var(--page);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      color: var(--brand-strong);
      background: #dbe5ff;
    }

    .site-header {
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      background: rgba(255, 255, 255, 0.82);
    }

    .site-header__inner,
    main,
    .site-footer__inner {
      width: min(100% - 2rem, 72rem);
      margin-inline: auto;
    }

    .site-header__inner {
      padding: 2.25rem 0 2rem;
    }

    .site-kicker {
      margin: 0 0 0.45rem;
      color: var(--brand);
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .site-title {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.65rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .site-description {
      max-width: 42rem;
      margin: 0.7rem 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    main {
      flex: 1;
      padding-block: clamp(1.5rem, 4vw, 3rem);
    }

    .site-footer {
      padding: 1.5rem 0 2rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .site-footer__inner {
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
    }

    a {
      color: var(--brand);
    }

    :focus-visible {
      outline: 3px solid rgba(49, 87, 213, 0.3);
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .site-header__inner,
      main,
      .site-footer__inner {
        width: min(100% - 1.25rem, 72rem);
      }

      .site-header__inner {
        padding-block: 1.6rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <p class="site-kicker">SKMU · Digital archive</p>
      <h1 class="site-title">{{ site.title }}</h1>
      <p class="site-description">{{ site.description }}</p>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      &copy; {{ site.time | date: '%Y' }} {{ site.title }}
    </div>
  </footer>
</body>
</html>
